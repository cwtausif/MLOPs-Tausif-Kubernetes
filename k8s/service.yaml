# D4 — One fixed address for all Flask pods (port 80 → container port 5000).
#
#   btc-api-service   ClusterIP → inside the cluster only (used by the Ingress)
#   btc-api-nodeport  NodePort  → reachable from your Mac:
#                                 minikube service btc-api-nodeport --url
apiVersion: v1
kind: Service
metadata:
  name: btc-api-service
  labels:
    app: btc-api
spec:
  type: ClusterIP
  selector:
    app: btc-api
  ports:
    - name: http
      port: 80
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: btc-api-nodeport
  labels:
    app: btc-api
spec:
  type: NodePort
  selector:
    app: btc-api
  ports:
    - name: http
      port: 80
      targetPort: 5000
      nodePort: 30080

# D5 - Horizontal Pod Autoscaler: add pods when CPU is busy.
#   CPU above 60% (of the 100m request) -> more pods, up to 8
#   Quiet again -> back down, to at least 2
# Needs the metrics-server addon (setup.sh enabled it).
# Watch it:  kubectl get hpa --watch
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: btc-api-hpa
  labels:
    app: btc-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: btc-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60   # scale down after 1 min of calm (faster demo)

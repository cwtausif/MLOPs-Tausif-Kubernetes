# Helper pod: a tiny container that also mounts the model disk (PVC),
# so we can copy model.pkl from your Mac into it:
#     ./k8s/load_model.sh
# The Flask pods notice the new file and load it automatically.
apiVersion: v1
kind: Pod
metadata:
  name: model-loader
  labels:
    app: model-loader
spec:
  containers:
    - name: loader
      image: busybox:1.36
      command: ["sh", "-c", "tail -f /dev/null"]   # just stay alive
      volumeMounts:
        - name: models
          mountPath: /models
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
  volumes:
    - name: models
      persistentVolumeClaim:
        claimName: btc-models-pvc

# D1 — Settings kept OUTSIDE the code.
#   ConfigMap → normal settings (safe to show)
#   Secret    → sensitive values (API keys, passwords)
# Both are given to the Flask pods as environment variables (see deployment.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: btc-api-config
  labels:
    app: btc-api
data:
  MODEL_STAGE: "production"
  LOG_LEVEL: "INFO"
  PORT: "5000"
  MODEL_DIR: "/app/models"
  GUNICORN_WORKERS: "2"
  OMP_NUM_THREADS: "1"   # XGBoost: 1 thread per worker (fits the 500m CPU limit)
---
apiVersion: v1
kind: Secret
metadata:
  name: btc-api-secret
  labels:
    app: btc-api
type: Opaque
# stringData = plain text here; Kubernetes stores it base64-encoded.
# Example values for the assignment — never commit real secrets to Git.
stringData:
  API_KEY: "demo-api-key-change-me"
  COINGECKO_API_KEY: "not-used-yfinance-needs-no-key"

# D2 - A disk that survives pod restarts.
# Holds model.pkl, metrics.json, predictions.json.
# Mounted at /app/models in every Flask pod (see deployment.yaml).
# Minikube's default "standard" storage class creates it automatically.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: btc-models-pvc
  labels:
    app: btc-api
spec:
  accessModes:
    - ReadWriteOnce        # fine on single-node Minikube: all pods share one node
  resources:
    requests:
      storage: 1Gi

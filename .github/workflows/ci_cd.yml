# CI/CD for the BTC forecasting API (Parts B3 + B4)
#
#   lint-test  -> flake8 + black --check + pytest + compile the Kubeflow pipeline
#   build-push -> build app/Dockerfile, tag with the commit SHA and "latest", push to
#                  - GitHub Container Registry (ghcr.io) - uses the built-in GITHUB_TOKEN
#                  - Docker Hub - when the DOCKER_USERNAME / DOCKER_PASSWORD secrets exist
#
# Runs on every push to main and every pull request (pull requests never push images).
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: btc-forecast-api
  PYTHON_VERSION: "3.12"

jobs:
  lint-test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (flake8)
        run: flake8 app src dags tests kubeflow loadtest

      - name: Format check (black)
        run: black --check app src dags tests kubeflow loadtest

      - name: Unit tests (pytest)
        run: pytest -v --junitxml=pytest-report.xml

      - name: Compile Kubeflow pipeline
        run: python kubeflow/btc_kfp_pipeline.py

      - name: Upload test report + pipeline spec
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: |
            pytest-report.xml
            kubeflow/btc_kfp_pipeline.yaml

  build-push:
    name: Build & push Docker images
    needs: lint-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3   # arm64 builds (Apple Silicon / ARM nodes)

      - uses: docker/setup-buildx-action@v3

      - name: Image names (lower-case owner for GHCR)
        id: names
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          tags="ghcr.io/${owner}/${IMAGE_NAME}:${GITHUB_SHA::7},ghcr.io/${owner}/${IMAGE_NAME}:latest"
          if [ -n "$DOCKER_USERNAME" ]; then
            tags="$tags,${DOCKER_USERNAME}/${IMAGE_NAME}:${GITHUB_SHA::7},${DOCKER_USERNAME}/${IMAGE_NAME}:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "pipeline=ghcr.io/${owner}/btc-pipeline:latest" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKER_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Kubeflow pipeline image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: kubeflow/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.pipeline }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Summary
        run: |
          echo "### Pushed images" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.names.outputs.tags }}" | tr ',' '\n' | sed 's/^/- `/;s/$/`/' >> "$GITHUB_STEP_SUMMARY"
